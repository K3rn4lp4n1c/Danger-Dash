name: Danger Dash Test CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: make install

    - name: Build dynamically linked game
      run: make

    - name: Run test on dynamically linked game
      run: make test
