name: Danger Dash Release CI

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: make install

    - name: Test CI environment
      run: make test PROD=true

    - name: Create release
      env:
          GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" --verify-tag \
            danger-dash \
            --title "Danger Dash ${GITHUB_REF_NAME}" \
            --notes "Automated Danger Dash ${GITHUB_REF_NAME} release"
